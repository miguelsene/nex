<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0D16" />
    <title>Nex — Converse. Compartilhe. Conecte-se.</title>
    <meta name="description" content="Chamadas de vídeo e áudio direto do navegador. Crie uma sala em segundos, sem cadastro." />
    <link rel="icon" type="image/png" href="/nex-192.png" />
    <link rel="apple-touch-icon" href="/nex-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      .initial-loader { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; margin:0; background:#0a0d16; color:#cfd3ee; font:500 15px Inter,system-ui,sans-serif; text-align:center; }
      .initial-loader strong { color:#fff; font:700 29px "Space Grotesk",system-ui,sans-serif; }
      .initial-loader__logo { width:94px; height:94px; object-fit:contain; }
      .initial-loader__spinner { width:28px; height:28px; border:3px solid rgba(255,255,255,.15); border-top-color:#22d3ee; border-radius:50%; animation:nex-spin .8s linear infinite; }
      .initial-loader p { margin:0; } @keyframes nex-spin { to { transform:rotate(360deg); } }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" role="status" aria-label="Carregando Nex">
        <img src="/nex.png" alt="Nex" class="initial-loader__logo" />
        <strong>Nex</strong>
        <span class="initial-loader__spinner"></span>
        <p>Preparando sua próxima aventura...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
